plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsreader'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.smsreader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // QuickAddActivity is a ReactActivity (a second React surface: the quick-add card).
  implementation 'com.facebook.react:react-android'
}
